<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cayth Token Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg: #141210;
  --surface: #1e1b17;
  --surface-raised: #272320;
  --border: #333028;
  --border-strong: #4a4438;
  --gold: #c9a84c;
  --gold-dim: #8a7434;
  --gold-glow: rgba(201,168,76,0.12);
  --text: #e8e0d4;
  --text-dim: #9a8e7e;
  --text-muted: #6a6258;
  --red: #a03838;
  --green: #4a8a4a;
  --blue: #4a7a9a;
  --radius: 10px;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-bottom: 120px;
}

/* ── Viewer banner ── */
.viewer-banner {
  display: none;
  background: rgba(74,122,154,0.15);
  border-bottom: 1px solid rgba(74,122,154,0.3);
  color: var(--blue);
  text-align: center;
  padding: 8px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.05em;
}
body.viewer .viewer-banner { display: block; }
body.viewer .token-close { display: none; }
body.viewer .ctrl-btn { pointer-events: none; opacity: 0.25; }
body.viewer .bottom-bar { pointer-events: none; opacity: 0.4; }
body.viewer #modeBtn { pointer-events: all; opacity: 1; }

/* ── Battlefield ── */
.battlefield {
  padding: 12px 12px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ── Token Card ── */
.token-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  position: relative;
}

.token-close {
  position: absolute;
  top: 8px; right: 8px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 0.85rem;
  cursor: pointer;
  padding: 4px 6px;
  line-height: 1;
}
.token-close:active { color: var(--red); }

.token-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  padding-right: 20px;
}

.token-name {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.token-base {
  font-size: 0.68rem;
  color: var(--text-muted);
}

.token-keywords {
  display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px;
}
.keyword-tag {
  font-size: 0.58rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--blue);
  background: rgba(74,122,154,0.12);
  border: 1px solid rgba(74,122,154,0.2);
  border-radius: 3px;
  padding: 1px 5px;
}
.keyword-tag.from-buff {
  color: var(--gold-dim);
  background: rgba(201,168,76,0.08);
  border-color: rgba(201,168,76,0.15);
}

.token-buff-sources {
  margin-top: 4px;
}
.buff-source-tag {
  font-size: 0.62rem;
  color: var(--text-muted);
  font-style: italic;
}

.token-effective {
  font-size: 2rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
  flex-shrink: 0;
}

.token-controls {
  display: flex;
  gap: 10px;
}

.control-group {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}

.control-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  white-space: nowrap;
}

.control-row { display: flex; align-items: center; margin-left: auto; }

.ctrl-btn {
  width: 38px; height: 38px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ctrl-btn:first-child { border-radius: 6px 0 0 6px; }
.ctrl-btn:last-child { border-radius: 0 6px 6px 0; }
.ctrl-btn:active { background: var(--gold-glow); }
.ctrl-btn.minus { color: var(--red); }
.ctrl-btn.plus { color: var(--green); }

.ctrl-value {
  width: 38px; height: 38px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: none; border-right: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  font-weight: 600;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 16px;
  font-size: 0.9rem;
  line-height: 1.6;
}

/* ── Bottom Bar ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 50;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 12px 12px;
}

.bottom-tokens {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.bottom-tokens::-webkit-scrollbar { display: none; }

.token-quick-btn {
  flex-shrink: 0;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 7px 12px;
  font-size: 0.75rem;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.token-quick-btn:active { background: var(--gold-glow); border-color: var(--gold-dim); }
.token-quick-btn.custom-add { color: var(--text-muted); border-style: dashed; }

.bottom-actions {
  display: flex;
  gap: 6px;
}

.action-btn {
  flex: 1;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px;
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-dim);
}
.action-btn:active { background: var(--gold-glow); }
.action-btn.proliferate { color: var(--green); }
.action-btn.buffs { color: var(--gold); }
.action-btn.is-host { color: var(--green); border-color: rgba(74,138,74,0.4); }
.action-btn .buff-count {
  background: var(--gold);
  color: var(--bg);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 0.65rem;
  font-weight: 700;
}

/* ── Buff Panel ── */
.panel-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 100;
}
.panel-overlay.open { display: block; }

.buff-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 101;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 14px 14px 0 0;
  padding: 16px 16px 32px;
  transform: translateY(100%);
  transition: transform 0.28s ease;
  max-height: 80dvh;
  overflow-y: auto;
}
.buff-panel.open { transform: translateY(0); }

.panel-handle {
  width: 32px; height: 3px;
  background: var(--border-strong);
  border-radius: 2px;
  margin: 0 auto 14px;
}

.panel-title {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.buff-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }

.buff-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--gold-glow);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.82rem;
}
.buff-item .buff-name { color: var(--gold); font-weight: 600; }
.buff-item .buff-note { color: var(--text-muted); font-size: 0.72rem; margin-left: 5px; }
.buff-remove { background: none; border: none; color: var(--text-muted); font-size: 1rem; cursor: pointer; padding: 2px 6px; }

.buff-presets {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
}

.buff-preset-btn {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 7px 10px;
  font-size: 0.72rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
}
.buff-preset-btn:active { background: var(--gold-glow); border-color: var(--gold-dim); }
.buff-preset-btn .buff-val { color: var(--gold); font-weight: 600; }
.buff-preset-btn.is-active { opacity: 0.38; pointer-events: none; }

.add-buff-row { display: flex; gap: 6px; }
.add-buff-row input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 9px 10px;
  font-size: 0.82rem;
  font-family: inherit;
  outline: none;
}
.add-buff-row input::placeholder { color: var(--text-muted); }
.add-buff-row input:focus { border-color: var(--gold-dim); }
.buff-pt { display: flex; gap: 4px; }
.buff-pt input {
  width: 40px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--gold);
  padding: 9px 0;
  font-size: 0.85rem;
  font-family: inherit;
  text-align: center;
  outline: none;
}
.btn-add-buff {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--gold);
  padding: 9px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.type-toggle {
  display: flex; margin: 8px 0;
}
.type-btn {
  flex: 1;
  padding: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
}
.type-btn:first-child { border-radius: 8px 0 0 8px; }
.type-btn:last-child { border-radius: 0 8px 8px 0; border-left: none; }
.type-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  width: 100%;
  max-width: 340px;
}
.modal-title {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.modal label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  display: block;
  margin-bottom: 4px;
}
.modal input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 9px 10px;
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
  margin-bottom: 10px;
}
.modal-pt { display: flex; gap: 8px; }
.modal-pt input { width: 50%; }
.modal-kw { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.kw-btn {
  padding: 6px 9px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 500;
  cursor: pointer;
}
.kw-btn.active { background: rgba(74,122,154,0.15); color: var(--blue); border-color: rgba(74,122,154,0.35); }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; }
.modal-actions button {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
}
.modal-cancel { background: var(--surface-raised); color: var(--text-muted); }
.modal-confirm { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim) !important; }
</style>
</head>
<body>

<div class="viewer-banner">👁 VIEWER — live från host</div>

<div class="battlefield" id="tokenList">
  <div class="empty-state">Inga tokens ännu.<br>Lägg till via knapparna nedan.</div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="bottom-tokens" id="quickButtons"></div>
  <div class="bottom-actions">
    <button class="action-btn proliferate" id="proliferateBtn" onclick="proliferate()">⟳ Proliferate</button>
    <button class="action-btn buffs" id="buffToggle" onclick="openBuffPanel()">⚔ Buffs <span class="buff-count" id="buffCountBadge" style="display:none">0</span></button>
    <button class="action-btn" id="modeBtn" onclick="toggleMode()">👁 Viewer</button>
  </div>
</div>

<!-- Buff Panel -->
<div class="panel-overlay" id="panelOverlay" onclick="closeBuffPanel()"></div>
<div class="buff-panel" id="buffPanel">
  <div class="panel-handle"></div>
  <div class="panel-title">Globala buffs</div>
  <div class="buff-list" id="buffList"></div>
  <div class="panel-title">Snabbval</div>
  <div class="buff-presets" id="buffPresets"></div>
  <div class="panel-title">Custom buff</div>
  <div class="add-buff-row">
    <input type="text" id="buffName" placeholder="Namn..." onkeydown="if(event.key==='Enter')addBuff()">
    <div class="buff-pt">
      <input type="number" id="buffP" value="1" onkeydown="if(event.key==='Enter')addBuff()">
      <input type="number" id="buffT" value="1" onkeydown="if(event.key==='Enter')addBuff()">
    </div>
    <button class="btn-add-buff" onclick="addBuff()">+</button>
  </div>
  <div class="type-toggle">
    <button class="type-btn active" id="buffTargetAll" onclick="setBuffTarget(null)">Alla tokens</button>
    <button class="type-btn" id="buffTargetArtifact" onclick="setBuffTarget('Artifact')">Artifact creatures</button>
  </div>
</div>

<!-- Custom Token Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal">
    <div class="modal-title">Custom token</div>
    <label>Namn</label>
    <input type="text" id="customName" placeholder="t.ex. Beast" onkeydown="if(event.key==='Enter')confirmCustom()">
    <label>Typ</label>
    <div class="type-toggle" style="margin-bottom:10px">
      <button class="type-btn active" id="typeCreature" onclick="setCustomType(false)">Creature</button>
      <button class="type-btn" id="typeArtifact" onclick="setCustomType(true)">Artifact Creature</button>
    </div>
    <label>Keywords</label>
    <div class="modal-kw" id="kwToggles"></div>
    <div class="modal-pt">
      <div><label>Power</label><input type="number" id="customP" value="1" onkeydown="if(event.key==='Enter')confirmCustom()"></div>
      <div><label>Toughness</label><input type="number" id="customT" value="1" onkeydown="if(event.key==='Enter')confirmCustom()"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Avbryt</button>
      <button class="modal-confirm" onclick="confirmCustom()">Lägg till</button>
    </div>
  </div>
</div>

<script>
  // ── Presets ──
  const TOKEN_PRESETS = [
    { name: 'Thopter', p: 1, t: 1, keywords: ['Flying', 'Artifact'] },
    { name: 'Servo',   p: 1, t: 1, keywords: ['Artifact'] },
    { name: 'Myr',     p: 1, t: 1, keywords: ['Artifact'] },
    { name: 'Golem',   p: 3, t: 3, keywords: ['Artifact'] },
    { name: 'Soldier', p: 1, t: 1, keywords: [] },
    { name: 'Shark',   p: 0, t: 0, keywords: ['Flying'], openModal: true },
    { name: '+ Custom', custom: true },
  ];

  const BUFF_PRESETS = [
    { name: 'Tempered Steel',      p: 2, t: 2, note: 'artifact creatures', grantsKeywords: [],            requires: 'Artifact' },
    { name: 'Intangible Virtue',   p: 1, t: 1, note: 'creature tokens',    grantsKeywords: ['Vigilance'], requires: null },
    { name: 'Chief of the Foundry',p: 1, t: 1, note: 'artifact creatures', grantsKeywords: [],            requires: 'Artifact' },
    { name: 'Angel of Invention',  p: 1, t: 1, note: 'other creatures',    grantsKeywords: [],            requires: null },
    { name: 'Inspiring Leader',    p: 2, t: 0, note: 'creature tokens',    grantsKeywords: [],            requires: null },
    { name: 'Urza, Prince of Kroog',p:2, t: 2, note: 'artifact creatures', grantsKeywords: [],            requires: 'Artifact' },
    { name: 'Master of Etherium',  p: 1, t: 1, note: 'artifact creatures', grantsKeywords: [],            requires: 'Artifact' },
  ];

  const KEYWORD_OPTIONS = ['Flying','Haste','Menace','Trample','Lifelink','Deathtouch','Vigilance'];
  const STORAGE_KEY = 'cayth-token-tracker';

  let tokens = [];
  let buffs = [];
  let isHost = false;
  let customIsArtifact = false;
  let customBuffTarget = null;
  let selectedKeywords = [];

  // ── Firebase sync (init via window.onload below) ──
  function syncToFirebase() {
    if (isHost && window._stateRef) window._stateRef.set({ tokens, buffs });
  }

  function toggleMode() {
    isHost = !isHost;
    const btn = document.getElementById('modeBtn');
    if (isHost) {
      btn.textContent = '🎮 Host';
      btn.classList.add('is-host');
      document.body.classList.remove('viewer');
      syncToFirebase();
    } else {
      btn.textContent = '👁 Viewer';
      btn.classList.remove('is-host');
      document.body.classList.add('viewer');
    }
  }

  // ── Storage ──
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ tokens, buffs })); } catch(e) {}
    syncToFirebase();
  }
  function loadState() {
    try {
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (d) { tokens = d.tokens || []; buffs = d.buffs || []; }
    } catch(e) {}
  }

  // ── Buff Panel ──
  function setBuffTarget(target) {
    customBuffTarget = target;
    document.getElementById('buffTargetAll').classList.toggle('active', target === null);
    document.getElementById('buffTargetArtifact').classList.toggle('active', target === 'Artifact');
  }
  function openBuffPanel() {
    document.getElementById('panelOverlay').classList.add('open');
    document.getElementById('buffPanel').classList.add('open');
  }
  function closeBuffPanel() {
    document.getElementById('panelOverlay').classList.remove('open');
    document.getElementById('buffPanel').classList.remove('open');
  }

  // ── Buff Logic ──
  function getBuffsForToken(token) {
    const kw = token.keywords || [];
    return buffs.filter(b => !b.requires || kw.includes(b.requires));
  }
  function tokenBuffP(token) { return getBuffsForToken(token).reduce((s,b) => s+b.p, 0); }
  function tokenBuffT(token) { return getBuffsForToken(token).reduce((s,b) => s+b.t, 0); }
  function getBuffKeywords(token) {
    const kw = [];
    getBuffsForToken(token).forEach(b => { (b.grantsKeywords||[]).forEach(k => { if(!kw.includes(k)) kw.push(k); }); });
    return kw;
  }

  function addPresetBuff(name) {
    const preset = BUFF_PRESETS.find(b => b.name === name);
    if (!preset || buffs.some(b => b.name === name)) return;
    buffs.push({ name: preset.name, p: preset.p, t: preset.t, note: preset.note, grantsKeywords: preset.grantsKeywords||[], requires: preset.requires||null });
    saveState(); renderAll();
  }

  function addBuff() {
    const name = document.getElementById('buffName').value.trim() || 'Anthem';
    const p = parseInt(document.getElementById('buffP').value) || 0;
    const t = parseInt(document.getElementById('buffT').value) || 0;
    buffs.push({ name, p, t, note: customBuffTarget ? 'artifact creatures' : 'alla tokens', grantsKeywords: [], requires: customBuffTarget });
    document.getElementById('buffName').value = '';
    document.getElementById('buffP').value = '1';
    document.getElementById('buffT').value = '1';
    customBuffTarget = null; setBuffTarget(null);
    saveState(); renderAll();
  }

  function removeBuff(i) { buffs.splice(i,1); saveState(); renderAll(); }

  // ── Token Logic ──
  function addPresetToken(name) {
    const p = TOKEN_PRESETS.find(t => t.name === name);
    if (!p) return;
    tokens.unshift({ name: p.name, baseP: p.p, baseT: p.t, qty: 1, counters: 0, keywords: p.keywords||[] });
    saveState(); renderAll();
  }

  function addToken(name, baseP, baseT, keywords=[]) {
    tokens.unshift({ name, baseP, baseT, qty: 1, counters: 0, keywords });
    saveState(); renderAll();
  }

  function updateQty(i, delta) {
    tokens[i].qty = Math.max(0, tokens[i].qty + delta);
    if (tokens[i].qty === 0) tokens.splice(i,1);
    saveState(); renderAll();
  }

  function updateCounters(i, delta) {
    tokens[i].counters = Math.max(0, tokens[i].counters + delta);
    saveState(); renderAll();
  }

  function removeToken(i) { tokens.splice(i,1); saveState(); renderAll(); }

  function proliferate() {
    let hit = 0;
    tokens.forEach(t => { if (t.counters > 0) { t.counters++; hit++; } });
    const btn = document.getElementById('proliferateBtn');
    if (hit > 0) {
      saveState(); renderAll();
      btn.style.opacity = '0.5';
      setTimeout(() => btn.style.opacity = '', 200);
    } else {
      const orig = btn.textContent;
      btn.textContent = '✕ Inga counters';
      btn.style.color = 'var(--red)';
      setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1000);
    }
  }

  // ── Modal ──
  function renderKwToggles() {
    document.getElementById('kwToggles').innerHTML = KEYWORD_OPTIONS.map(kw =>
      `<button class="kw-btn${selectedKeywords.includes(kw)?' active':''}" onclick="toggleKw('${kw}')">${kw}</button>`
    ).join('');
  }
  function toggleKw(kw) {
    selectedKeywords = selectedKeywords.includes(kw) ? selectedKeywords.filter(k=>k!==kw) : [...selectedKeywords, kw];
    renderKwToggles();
  }
  function setCustomType(isArt) {
    customIsArtifact = isArt;
    document.getElementById('typeCreature').classList.toggle('active', !isArt);
    document.getElementById('typeArtifact').classList.toggle('active', isArt);
  }
  function resetModal() {
    document.getElementById('customName').value = '';
    document.getElementById('customP').value = '1';
    document.getElementById('customT').value = '1';
    customIsArtifact = false; setCustomType(false);
    selectedKeywords = []; renderKwToggles();
  }
  function openModal() { resetModal(); document.getElementById('customModal').classList.add('open'); document.getElementById('customName').focus(); }
  function openModalPrefilled(name, p, t, kwString) {
    resetModal();
    const keywords = kwString ? kwString.split(',') : [];
    document.getElementById('customName').value = name;
    document.getElementById('customP').value = p;
    document.getElementById('customT').value = t;
    if (keywords.includes('Artifact')) { customIsArtifact = true; setCustomType(true); }
    selectedKeywords = keywords.filter(k => k !== 'Artifact');
    renderKwToggles();
    document.getElementById('customModal').classList.add('open');
    document.getElementById('customP').focus();
    document.getElementById('customP').select();
  }
  function closeModal() { document.getElementById('customModal').classList.remove('open'); }
  function confirmCustom() {
    const name = document.getElementById('customName').value.trim() || 'Token';
    const p = parseInt(document.getElementById('customP').value) || 0;
    const t = parseInt(document.getElementById('customT').value) || 0;
    const keywords = [...selectedKeywords];
    if (customIsArtifact) keywords.unshift('Artifact');
    addToken(name, p, t, keywords);
    closeModal();
  }

  // ── Render ──
  function renderAll() {
    // Quick buttons
    document.getElementById('quickButtons').innerHTML = TOKEN_PRESETS.map(tp => {
      if (tp.custom) return `<button class="token-quick-btn custom-add" onclick="openModal()">+ Custom</button>`;
      if (tp.openModal) {
        const kwStr = (tp.keywords||[]).join(',');
        return `<button class="token-quick-btn" onclick="openModalPrefilled('${tp.name}',${tp.p},${tp.t},'${kwStr}')">${tp.name} X/X</button>`;
      }
      return `<button class="token-quick-btn" onclick="addPresetToken('${tp.name}')">${tp.p}/${tp.t} ${tp.name}</button>`;
    }).join('');

    // Buff badge
    const badge = document.getElementById('buffCountBadge');
    badge.textContent = buffs.length;
    badge.style.display = buffs.length ? 'inline' : 'none';

    // Buff list
    const buffListEl = document.getElementById('buffList');
    buffListEl.innerHTML = buffs.length
      ? buffs.map((b,i) => `
          <div class="buff-item">
            <div>
              <span class="buff-name">${b.name} +${b.p}/+${b.t}</span>
              <span class="buff-note">${b.note ? '('+b.note+')' : ''}${b.grantsKeywords&&b.grantsKeywords.length ? ' → '+b.grantsKeywords.join(', ') : ''}</span>
            </div>
            <button class="buff-remove" onclick="removeBuff(${i})">✕</button>
          </div>`).join('')
      : '<div style="color:var(--text-muted);font-size:0.8rem;padding:4px 0;">Inga aktiva buffs.</div>';

    // Buff presets
    document.getElementById('buffPresets').innerHTML = BUFF_PRESETS.map(bp => {
      const active = buffs.some(b => b.name === bp.name);
      return `<button class="buff-preset-btn${active?' is-active':''}" onclick="addPresetBuff('${bp.name}')">
        ${active?'✓ ':''}${bp.name} <span class="buff-val">+${bp.p}/+${bp.t}</span>
      </button>`;
    }).join('');

    // Tokens
    const listEl = document.getElementById('tokenList');
    if (!tokens.length) {
      listEl.innerHTML = '<div class="empty-state">Inga tokens ännu.<br>Lägg till via knapparna nedan.</div>';
      return;
    }

    listEl.innerHTML = tokens.map((t,i) => {
      const bp = tokenBuffP(t), bt = tokenBuffT(t);
      const effP = t.baseP + t.counters + bp;
      const effT = t.baseT + t.counters + bt;
      const changed = effP !== t.baseP || effT !== t.baseT;

      const baseKw = t.keywords || [];
      const buffKw = getBuffKeywords(t);
      const allKw = [...baseKw];
      buffKw.forEach(k => { if (!allKw.includes(k)) allKw.push(k); });

      const kwHtml = allKw.length ? `<div class="token-keywords">${allKw.map(k =>
        `<span class="keyword-tag${!baseKw.includes(k)?' from-buff':''}">${k}</span>`).join('')}</div>` : '';

      const activeBuffs = getBuffsForToken(t);
      const buffSourceHtml = activeBuffs.length
        ? `<div class="token-buff-sources">${activeBuffs.map(b => `<span class="buff-source-tag">${b.name} +${b.p}/+${b.t}</span>`).join(' · ')}</div>` : '';

      return `
        <div class="token-card">
          <button class="token-close" onclick="removeToken(${i})">✕</button>
          <div class="token-header">
            <div>
              <div class="token-name">${t.name}</div>
              ${changed ? `<div class="token-base">bas ${t.baseP}/${t.baseT}</div>` : ''}
              ${kwHtml}
              ${buffSourceHtml}
            </div>
            <div class="token-effective">${effP}/${effT}</div>
          </div>
          <div class="token-controls">
            <div class="control-group">
              <span class="control-label">Antal</span>
              <div class="control-row">
                <button class="ctrl-btn minus" onclick="updateQty(${i},-1)">−</button>
                <div class="ctrl-value">${t.qty}</div>
                <button class="ctrl-btn plus" onclick="updateQty(${i},1)">+</button>
              </div>
            </div>
            <div class="control-group">
              <span class="control-label">+1/+1</span>
              <div class="control-row">
                <button class="ctrl-btn minus" onclick="updateCounters(${i},-1)">−</button>
                <div class="ctrl-value">${t.counters}</div>
                <button class="ctrl-btn plus" onclick="updateCounters(${i},1)">+</button>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  loadState();
  renderAll();
  document.body.classList.add('viewer');
</script>
