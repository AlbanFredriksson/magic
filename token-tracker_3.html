<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cayth Token Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1a1714;
    --surface: #252119;
    --surface-raised: #302a22;
    --border: #3d3529;
    --gold: #c9a84c;
    --gold-dim: #8a7434;
    --gold-glow: rgba(201, 168, 76, 0.15);
    --text: #e8e0d4;
    --text-dim: #9a8e7e;
    --red: #b04040;
    --green: #5a9a5a;
    --blue: #5a8ab0;
    --radius: 12px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: 0;
  }

  /* ── Sticky Header ── */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    padding: 12px 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  .header-actions {
    display: flex;
    gap: 6px;
  }

  .mode-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-btn.is-host { color: var(--green); border-color: rgba(90,154,90,0.4); }
  .mode-btn:active { background: var(--gold-glow); }

  .viewer-banner {
    display: none;
    background: rgba(90, 138, 176, 0.15);
    border-bottom: 1px solid rgba(90, 138, 176, 0.3);
    color: var(--blue);
    text-align: center;
    padding: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  body.viewer .viewer-banner { display: block; }
  body.viewer .quick-buttons { display: none; }
  body.viewer .proliferate-btn { display: none; }
  body.viewer .buff-toggle { display: none; }
  body.viewer .token-close { display: none; }
  body.viewer .ctrl-btn { pointer-events: none; opacity: 0.3; }
  body.viewer .buff-remove { display: none; }

  .proliferate-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--green);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .proliferate-btn:active { background: rgba(90, 154, 90, 0.15); border-color: var(--green); }
  .proliferate-btn.flash { background: rgba(90, 154, 90, 0.2); border-color: var(--green); }

  .buff-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--gold);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }
  .buff-toggle:active { background: var(--gold-glow); }
  .buff-toggle .buff-count {
    background: var(--gold);
    color: var(--bg);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .buff-toggle.no-buffs .buff-count { display: none; }

  .quick-buttons {
    display: flex;
    gap: 6px;
    padding-bottom: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .quick-buttons::-webkit-scrollbar { display: none; }

  .quick-btn {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 8px 14px;
    font-size: 0.72rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .quick-btn:active { background: var(--gold-glow); border-color: var(--gold-dim); }
  .quick-btn .token-pt {
    font-weight: 700;
    font-size: 0.85rem;
    display: block;
    color: var(--gold);
    margin-bottom: 1px;
  }
  .quick-btn.custom-add {
    border-style: dashed;
    color: var(--text-dim);
    font-size: 0.7rem;
  }

  /* ── Battlefield ── */
  .battlefield {
    padding: 16px;
    padding-bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .token-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    position: relative;
  }

  .token-close {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    opacity: 0.5;
  }
  .token-close:active { opacity: 1; color: var(--red); }

  .token-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .token-name {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    color: var(--gold);
  }
  .token-base {
    font-size: 0.68rem;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
  }

  .token-keywords {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px;
  }
  .keyword-tag {
    font-size: 0.58rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--blue);
    background: rgba(90, 138, 176, 0.12);
    border: 1px solid rgba(90, 138, 176, 0.25);
    border-radius: 4px;
    padding: 2px 5px;
  }
  .keyword-tag.from-buff {
    color: var(--gold);
    background: rgba(201, 168, 76, 0.1);
    border-color: rgba(201, 168, 76, 0.2);
  }

  .token-buff-sources {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px;
  }
  .buff-source-tag {
    font-size: 0.58rem;
    font-weight: 500;
    color: var(--gold-dim);
    background: rgba(201, 168, 76, 0.08);
    border: 1px dashed rgba(201, 168, 76, 0.2);
    border-radius: 4px;
    padding: 2px 5px;
    font-style: italic;
  }

  .token-effective {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .token-controls {
    display: flex;
    gap: 12px;
  }

  .control-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .control-label {
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  .control-row {
    display: flex;
    align-items: center;
  }

  .ctrl-btn {
    width: 44px; height: 44px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn:first-child { border-radius: 8px 0 0 8px; }
  .ctrl-btn:last-child { border-radius: 0 8px 8px 0; }
  .ctrl-btn:active { background: var(--gold-glow); }
  .ctrl-btn.minus { color: var(--red); }
  .ctrl-btn.plus { color: var(--green); }

  .ctrl-value {
    width: 44px; height: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: none; border-right: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 16px;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* ── Buff Panel (slide-up) ── */
  .panel-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
  }
  .panel-overlay.open { display: block; }

  .buff-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 101;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 20px 16px 32px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    max-height: 80dvh;
    overflow-y: auto;
  }
  .buff-panel.open { transform: translateY(0); }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .buff-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }

  .buff-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--gold-glow);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
  }
  .buff-item span { color: var(--gold); font-weight: 600; }
  .buff-item .buff-note { color: var(--text-dim); font-weight: 400; font-size: 0.73rem; margin-left: 5px; }

  .buff-remove {
    background: none; border: none; color: var(--text-dim);
    font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
  }

  .buff-presets {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
  }

  .buff-preset-btn {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 0.72rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    line-height: 1.3;
  }
  .buff-preset-btn:active { background: var(--gold-glow); border-color: var(--gold-dim); }
  .buff-preset-btn .buff-val { color: var(--gold); font-weight: 600; }
  .buff-preset-btn.is-active {
    opacity: 0.4;
    pointer-events: none;
  }

  .add-buff-row {
    display: flex; gap: 8px;
  }
  .add-buff-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.85rem;
    font-family: inherit;
    outline: none;
  }
  .add-buff-row input::placeholder { color: var(--text-dim); }
  .add-buff-row input:focus { border-color: var(--gold-dim); }

  .buff-pt {
    display: flex; gap: 4px;
  }
  .buff-pt input {
    width: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--gold);
    padding: 10px 0;
    font-size: 0.9rem;
    font-family: inherit;
    text-align: center;
    outline: none;
  }
  .buff-pt input:focus { border-color: var(--gold-dim); }

  .btn-add-buff {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--gold);
    padding: 10px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* ── Custom Token Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 340px;
  }
  .modal h2 {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .modal label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    display: block;
    margin-bottom: 4px;
  }
  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-pt { display: flex; gap: 8px; }
  .modal-pt input { width: 50%; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  .modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .modal-cancel { background: var(--surface-raised); color: var(--text-dim); }
  .modal-confirm { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim) !important; }

  .modal-type-toggle {
    display: flex; gap: 0; margin-bottom: 14px;
  }
  .type-btn {
    flex: 1;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
  }
  .type-btn:first-child { border-radius: 8px 0 0 8px; }
  .type-btn:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .type-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }

  .modal-keywords {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .kw-btn {
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
  }
  .kw-btn.active { background: rgba(90, 138, 176, 0.15); color: var(--blue); border-color: rgba(90, 138, 176, 0.4); }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="viewer-banner" id="viewerBanner">👁 VIEWER — live från host</div>

<!-- Sticky Header -->
<div class="sticky-header">
  <div class="header-top">
    <div class="header-actions">
      <button class="mode-btn" id="modeBtn" onclick="toggleMode()">👁 Viewer</button>
      <button class="proliferate-btn" id="proliferateBtn" onclick="proliferate()">⟳ Proliferate</button>
      <button class="buff-toggle" id="buffToggle" onclick="openBuffPanel()">
        ⚔ Buffs <span class="buff-count" id="buffCountBadge">0</span>
      </button>
    </div>
  </div>
  <div class="quick-buttons" id="quickButtons"></div>
</div>

<!-- Battlefield -->
<div class="battlefield" id="tokenList">
  <div class="empty-state">Inga tokens ännu.<br>Tryck på en token ovan.</div>
</div>

<!-- Buff Panel -->
<div class="panel-overlay" id="panelOverlay" onclick="closeBuffPanel()"></div>
<div class="buff-panel" id="buffPanel">
  <div class="panel-handle"></div>
  <div class="panel-title">Globala Buffs</div>
  <div class="buff-list" id="buffList"></div>
  <div class="section-label" style="margin-bottom:6px">Snabbval</div>
  <div class="buff-presets" id="buffPresets"></div>
  <div class="section-label" style="margin-bottom:6px">Custom buff</div>
  <div class="add-buff-row">
    <input type="text" id="buffName" placeholder="Namn..." onkeydown="if(event.key==='Enter')addBuff()">
    <div class="buff-pt">
      <input type="number" id="buffP" placeholder="+P" value="1" onkeydown="if(event.key==='Enter')addBuff()">
      <input type="number" id="buffT" placeholder="+T" value="1" onkeydown="if(event.key==='Enter')addBuff()">
    </div>
    <button class="btn-add-buff" onclick="addBuff()">+</button>
  </div>
  <div class="modal-type-toggle" style="margin-top:8px">
    <button class="type-btn active" id="buffTargetAll" onclick="setBuffTarget(null)">Alla tokens</button>
    <button class="type-btn" id="buffTargetArtifact" onclick="setBuffTarget('Artifact')">Artifact creatures</button>
  </div>
</div>

<!-- Custom Token Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal">
    <h2>Custom Token</h2>
    <label>Namn</label>
    <input type="text" id="customName" placeholder="t.ex. Beast" onkeydown="if(event.key==='Enter')confirmCustom()">
    <div class="modal-pt">
      <div><label>Power</label><input type="number" id="customP" value="1" onkeydown="if(event.key==='Enter')confirmCustom()"></div>
      <div><label>Toughness</label><input type="number" id="customT" value="1" onkeydown="if(event.key==='Enter')confirmCustom()"></div>
    </div>
    <label>Typ</label>
    <div class="modal-type-toggle">
      <button class="type-btn active" id="typeCreature" onclick="setCustomType(false)">Creature</button>
      <button class="type-btn" id="typeArtifact" onclick="setCustomType(true)">Artifact Creature</button>
    </div>
    <label>Keywords</label>
    <div class="modal-keywords" id="kwToggles"></div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Avbryt</button>
      <button class="modal-confirm" onclick="confirmCustom()">Lägg till</button>
    </div>
  </div>
</div>

<script>
  // ── Presets ──
  const TOKEN_PRESETS = [
    { name: 'Thopter', p: 1, t: 1, note: '✈ Flying', keywords: ['Flying', 'Artifact'] },
    { name: 'Servo', p: 1, t: 1, note: '', keywords: ['Artifact'] },
    { name: 'Myr', p: 1, t: 1, note: '', keywords: ['Artifact'] },
    { name: 'Golem', p: 3, t: 3, note: '', keywords: ['Artifact'] },
    { name: 'Shark', p: 0, t: 0, note: '✈ X/X', keywords: ['Flying'], openModal: true },
    { name: 'Soldier', p: 1, t: 1, note: '', keywords: [] },
    { name: 'Custom...', p: 0, t: 0, custom: true },
  ];

  const BUFF_PRESETS = [
    { name: 'Tempered Steel', p: 2, t: 2, note: 'artifact creatures', grantsKeywords: [], requires: 'Artifact' },
    { name: 'Intangible Virtue', p: 1, t: 1, note: 'creature tokens', grantsKeywords: ['Vigilance'], requires: null },
    { name: 'Chief of the Foundry', p: 1, t: 1, note: 'artifact creatures', grantsKeywords: [], requires: 'Artifact' },
    { name: 'Angel of Invention', p: 1, t: 1, note: 'other creatures', grantsKeywords: [], requires: null },
    { name: 'Inspiring Leader', p: 2, t: 0, note: 'creature tokens', grantsKeywords: [], requires: null },
  ];

  // ── Firebase ──
  const firebaseConfig = {
    apiKey: "AIzaSyD5UJ2zjygXz4qrNfHJJf5MixObtdkaiFc",
    authDomain: "cayth-tracker.firebaseapp.com",
    databaseURL: "https://cayth-tracker-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "cayth-tracker",
    storageBucket: "cayth-tracker.firebasestorage.app",
    messagingSenderId: "187853117694",
    appId: "1:187853117694:web:fe08800c14b2231084adaf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const stateRef = db.ref('board');

  let isHost = false;

  function toggleMode() {
    isHost = !isHost;
    const btn = document.getElementById('modeBtn');
    if (isHost) {
      btn.textContent = '🎮 Host';
      btn.classList.add('is-host');
      document.body.classList.remove('viewer');
      // Push current local state to Firebase
      syncToFirebase();
    } else {
      btn.textContent = '👁 Viewer';
      btn.classList.remove('is-host');
      document.body.classList.add('viewer');
    }
  }

  function syncToFirebase() {
    if (!isHost) return;
    stateRef.set({ tokens, buffs });
  }

  // Listen for changes from Firebase
  stateRef.on('value', (snapshot) => {
    if (isHost) return; // Host uses local state
    const data = snapshot.val();
    if (data) {
      tokens = data.tokens || [];
      buffs = data.buffs || [];
      renderAll();
    }
  });

  const STORAGE_KEY = 'cayth-token-tracker';
  let tokens = [];
  let buffs = [];

  // ── LocalStorage ──
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ tokens, buffs })); } catch(e) {}
    syncToFirebase();
  }
  function loadState() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (data) { tokens = data.tokens || []; buffs = data.buffs || []; }
    } catch(e) {}
  }

  // ── Buff Panel ──
  let customBuffTarget = null;

  function setBuffTarget(target) {
    customBuffTarget = target;
    document.getElementById('buffTargetAll').classList.toggle('active', target === null);
    document.getElementById('buffTargetArtifact').classList.toggle('active', target === 'Artifact');
  }

  function openBuffPanel() {
    document.getElementById('panelOverlay').classList.add('open');
    document.getElementById('buffPanel').classList.add('open');
  }
  function closeBuffPanel() {
    document.getElementById('panelOverlay').classList.remove('open');
    document.getElementById('buffPanel').classList.remove('open');
  }

  // ── Render presets ──
  function renderPresets() {
    const quickEl = document.getElementById('quickButtons');
    quickEl.innerHTML = TOKEN_PRESETS.map(tp => {
      if (tp.custom) {
        return `<button class="quick-btn custom-add" onclick="openModal()">＋ Custom</button>`;
      }
      if (tp.openModal) {
        const kwStr = (tp.keywords || []).join(',');
        return `<button class="quick-btn" onclick="openModalPrefilled('${tp.name}',${tp.p},${tp.t},'${kwStr}')">
          <span class="token-pt">X/X</span>${tp.name}${tp.note ? '<br>' + tp.note : ''}
        </button>`;
      }
      return `<button class="quick-btn" onclick="addPresetToken('${tp.name}')">
        <span class="token-pt">${tp.p}/${tp.t}</span>${tp.name}
      </button>`;
    }).join('');
  }

  // ── Buff logic ──
  function getBuffsForToken(token) {
    const kw = token.keywords || [];
    return buffs.filter(b => !b.requires || kw.includes(b.requires));
  }
  function tokenBuffP(token) { return getBuffsForToken(token).reduce((s, b) => s + b.p, 0); }
  function tokenBuffT(token) { return getBuffsForToken(token).reduce((s, b) => s + b.t, 0); }
  function getBuffKeywords(token) {
    const kw = [];
    getBuffsForToken(token).forEach(b => {
      if (b.grantsKeywords) b.grantsKeywords.forEach(k => { if (!kw.includes(k)) kw.push(k); });
    });
    return kw;
  }

  function addPresetBuff(name) {
    const preset = BUFF_PRESETS.find(b => b.name === name);
    if (!preset) return;
    if (buffs.some(b => b.name === preset.name)) return;
    buffs.push({ name: preset.name, p: preset.p, t: preset.t, note: preset.note, grantsKeywords: preset.grantsKeywords || [], requires: preset.requires || null });
    saveState(); renderAll();
  }

  function addBuff() {
    const nameEl = document.getElementById('buffName');
    const pEl = document.getElementById('buffP');
    const tEl = document.getElementById('buffT');
    const name = nameEl.value.trim() || 'Anthem';
    const p = parseInt(pEl.value) || 0;
    const t = parseInt(tEl.value) || 0;
    buffs.push({ name, p, t, note: customBuffTarget ? 'artifact creatures' : 'alla tokens', grantsKeywords: [], requires: customBuffTarget });
    nameEl.value = ''; pEl.value = '1'; tEl.value = '1';
    customBuffTarget = null;
    setBuffTarget(null);
    saveState(); renderAll();
  }

  function removeBuff(i) {
    buffs.splice(i, 1);
    saveState(); renderAll();
  }

  // ── Token logic ──
  function addPresetToken(name) {
    const preset = TOKEN_PRESETS.find(t => t.name === name);
    if (!preset) return;
    tokens.unshift({ name: preset.name, baseP: preset.p, baseT: preset.t, qty: 1, counters: 0, keywords: preset.keywords || [] });
    saveState(); renderAll();
  }

  function addToken(name, baseP, baseT, keywords = []) {
    tokens.unshift({ name, baseP, baseT, qty: 1, counters: 0, keywords });
    saveState(); renderAll();
  }

  function updateQty(i, delta) {
    tokens[i].qty = Math.max(0, tokens[i].qty + delta);
    if (tokens[i].qty === 0) tokens.splice(i, 1);
    saveState(); renderAll();
  }

  function updateCounters(i, delta) {
    tokens[i].counters = Math.max(0, tokens[i].counters + delta);
    saveState(); renderAll();
  }

  function removeToken(i) {
    tokens.splice(i, 1);
    saveState(); renderAll();
  }

  function proliferate() {
    let affected = 0;
    tokens.forEach(t => {
      if (t.counters > 0) { t.counters++; affected++; }
    });
    const btn = document.getElementById('proliferateBtn');
    if (affected > 0) {
      saveState(); renderAll();
      btn.classList.add('flash');
      setTimeout(() => btn.classList.remove('flash'), 300);
    } else {
      btn.style.color = 'var(--red)';
      btn.textContent = '⟳ Inga counters';
      setTimeout(() => {
        btn.style.color = '';
        btn.textContent = '⟳ Proliferate';
      }, 1000);
    }
  }

  // ── Modal ──
  let customIsArtifact = false;
  const KEYWORD_OPTIONS = ['Flying', 'Haste', 'Menace', 'Trample', 'Lifelink', 'Deathtouch', 'Vigilance'];
  let selectedKeywords = [];

  function renderKwToggles() {
    document.getElementById('kwToggles').innerHTML = KEYWORD_OPTIONS.map(kw =>
      `<button class="kw-btn${selectedKeywords.includes(kw) ? ' active' : ''}" onclick="toggleKw('${kw}')">${kw}</button>`
    ).join('');
  }

  function toggleKw(kw) {
    if (selectedKeywords.includes(kw)) {
      selectedKeywords = selectedKeywords.filter(k => k !== kw);
    } else {
      selectedKeywords.push(kw);
    }
    renderKwToggles();
  }

  function setCustomType(isArtifact) {
    customIsArtifact = isArtifact;
    document.getElementById('typeCreature').classList.toggle('active', !isArtifact);
    document.getElementById('typeArtifact').classList.toggle('active', isArtifact);
  }

  function resetModal() {
    document.getElementById('customName').value = '';
    document.getElementById('customP').value = '1';
    document.getElementById('customT').value = '1';
    customIsArtifact = false;
    setCustomType(false);
    selectedKeywords = [];
    renderKwToggles();
  }

  function openModal() {
    resetModal();
    document.getElementById('customModal').classList.add('open');
    document.getElementById('customName').focus();
  }

  function openModalPrefilled(name, p, t, kwString) {
    resetModal();
    const keywords = kwString ? kwString.split(',') : [];
    document.getElementById('customName').value = name;
    document.getElementById('customP').value = p;
    document.getElementById('customT').value = t;
    if (keywords.includes('Artifact')) {
      customIsArtifact = true;
      setCustomType(true);
    }
    selectedKeywords = keywords.filter(k => k !== 'Artifact');
    renderKwToggles();
    document.getElementById('customModal').classList.add('open');
    document.getElementById('customP').focus();
    document.getElementById('customP').select();
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('open');
  }

  function confirmCustom() {
    const name = document.getElementById('customName').value.trim() || 'Token';
    const p = parseInt(document.getElementById('customP').value) || 0;
    const t = parseInt(document.getElementById('customT').value) || 0;
    const keywords = [...selectedKeywords];
    if (customIsArtifact) keywords.unshift('Artifact');
    addToken(name, p, t, keywords);
    closeModal();
  }

  // ── Render ──
  function renderAll() {
    // Buff badge
    const badge = document.getElementById('buffCountBadge');
    const toggle = document.getElementById('buffToggle');
    badge.textContent = buffs.length;
    toggle.classList.toggle('no-buffs', buffs.length === 0);

    // Buff list in panel
    const buffListEl = document.getElementById('buffList');
    if (buffs.length === 0) {
      buffListEl.innerHTML = '<div style="color:var(--text-dim);font-size:0.8rem;padding:8px 0;">Inga aktiva buffs.</div>';
    } else {
      buffListEl.innerHTML = buffs.map((b, i) => `
        <div class="buff-item">
          <span>${b.name} +${b.p}/+${b.t}${b.note ? '<span class="buff-note">(' + b.note + ')</span>' : ''}${b.grantsKeywords && b.grantsKeywords.length ? '<span class="buff-note">→ ' + b.grantsKeywords.join(', ') + '</span>' : ''}</span>
          <button class="buff-remove" onclick="removeBuff(${i})">✕</button>
        </div>
      `).join('');
    }

    // Buff presets (dim active ones)
    const buffEl = document.getElementById('buffPresets');
    buffEl.innerHTML = BUFF_PRESETS.map(bp => {
      const isActive = buffs.some(b => b.name === bp.name);
      return `<button class="buff-preset-btn${isActive ? ' is-active' : ''}" onclick="addPresetBuff('${bp.name}')">
        ${isActive ? '✓ ' : ''}${bp.name} <span class="buff-val">+${bp.p}/+${bp.t}</span>
      </button>`;
    }).join('');

    // Tokens
    const listEl = document.getElementById('tokenList');
    if (tokens.length === 0) {
      listEl.innerHTML = '<div class="empty-state">Inga tokens ännu.<br>Tryck på en token ovan.</div>';
      return;
    }

    listEl.innerHTML = tokens.map((t, i) => {
      const bp = tokenBuffP(t);
      const bt = tokenBuffT(t);
      const effP = t.baseP + t.counters + bp;
      const effT = t.baseT + t.counters + bt;
      const changed = (effP !== t.baseP || effT !== t.baseT);

      const baseKw = t.keywords || [];
      const buffKw = getBuffKeywords(t);
      const allKw = [...baseKw];
      buffKw.forEach(k => { if (!allKw.includes(k)) allKw.push(k); });

      const kwHtml = allKw.length ? `
        <div class="token-keywords">
          ${allKw.map(k => `<span class="keyword-tag${!baseKw.includes(k) ? ' from-buff' : ''}">${k}</span>`).join('')}
        </div>` : '';

      const activeBuffs = getBuffsForToken(t);
      const buffNamesHtml = activeBuffs.length ? `
        <div class="token-buff-sources">
          ${activeBuffs.map(b => `<span class="buff-source-tag">${b.name} +${b.p}/+${b.t}</span>`).join('')}
        </div>` : '';

      return `
        <div class="token-card">
          <button class="token-close" onclick="removeToken(${i})">✕</button>
          <div class="token-header">
            <div>
              <div class="token-name">${t.name}</div>
              ${changed ? '<div class="token-base">bas ' + t.baseP + '/' + t.baseT + '</div>' : ''}
              ${kwHtml}
              ${buffNamesHtml}
            </div>
            <div class="token-effective">${effP}/${effT}</div>
          </div>
          <div class="token-controls">
            <div class="control-group">
              <div class="control-label">Antal</div>
              <div class="control-row">
                <button class="ctrl-btn minus" onclick="updateQty(${i},-1)">−</button>
                <div class="ctrl-value">${t.qty}</div>
                <button class="ctrl-btn plus" onclick="updateQty(${i},1)">+</button>
              </div>
            </div>
            <div class="control-group">
              <div class="control-label">+1/+1</div>
              <div class="control-row">
                <button class="ctrl-btn minus" onclick="updateCounters(${i},-1)">−</button>
                <div class="ctrl-value">${t.counters}</div>
                <button class="ctrl-btn plus" onclick="updateCounters(${i},1)">+</button>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  loadState();
  renderPresets();
  renderAll();

  // Start as viewer — click Host to take control
  document.body.classList.add('viewer');
</script>

</body>
</html>
